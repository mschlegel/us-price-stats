name: sync-price-data

on:
  schedule:
    # Weekdays 14:07 UTC = 10:07 EDT / 9:07 EST — after the 8:30 ET CPI/PPI releases.
    - cron: "7 14 * * 1-5"
    # Second pass mid-afternoon ET catches late file postings.
    - cron: "7 19 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Re-download everything even if BLS listings look unchanged"
        type: boolean
        default: false
      only:
        description: "Comma-separated BLS survey codes to limit to (e.g. cu,cw)"
        default: ""

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch
        id: fetch
        continue-on-error: true   # still commit whatever succeeded; fail the run at the end
        env:
          BLS_CONTACT_EMAIL: ${{ vars.BLS_CONTACT_EMAIL }}
          BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
          FORCE: ${{ inputs.force && '1' || '' }}
          ONLY: ${{ inputs.only }}
        run: python scripts/sync.py

      - name: Validate
        run: python scripts/validate.py

      - name: Commit & tag vintage
        run: |
          git config user.name  "price-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data state
          if git diff --cached --quiet; then
            echo "No new data."; exit 0
          fi
          stamp=$(date -u +%Y-%m-%dT%H%MZ)
          { echo "data: sync $stamp"; echo; head -50 state/last_run.txt; } > /tmp/msg
          git commit -F /tmp/msg
          git tag -a "vintage-$stamp" -m "BLS/BEA data as of $stamp"   # annotated: --follow-tags skips lightweight tags
          git push --follow-tags

      - name: Surface fetch failure
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::error::One or more sources failed to download; see Fetch step log."
          exit 1
